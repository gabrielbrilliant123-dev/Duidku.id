<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<title>Nana Budget</title>
<style>
:root{--bg:#0a0a0a;--card:#161616;--line:#262626;--tx:#f5f5f5;--mut:#8a8a8a;--ac:#fff;--bad:#c9c9c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:baseline;padding:calc(18px + env(safe-area-inset-top)) 20px 8px}
h1{font-size:22px;font-weight:600;letter-spacing:.5px;margin:0}
#hdate,.mut{color:var(--mut);font-size:13px}
main{padding:8px 16px;max-width:560px;margin:auto;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:500;color:var(--mut)}
.big{font-size:32px;font-weight:600;letter-spacing:-.5px}
.mid{font-size:20px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
.hero{background:linear-gradient(145deg,#222,#111)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .5s}
.bar.over i{background:#777}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item small{display:block;color:var(--mut)}
.in{color:#fff}.out{color:var(--bad)}
svg{width:100%;height:auto}svg text{fill:#8a8a8a;font-size:10px}
.leg{font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;background:#fff;margin:0 4px 0 0}.leg i.g{background:#777;margin-left:10px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}
.pri{background:#fff;color:#000;border-color:#fff;font-weight:600}
.danger{border-color:#555;color:#ddd}.ghost{background:none}
.btns{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.btns button{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f0f0fee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;padding:10px 2px}
nav button.on{color:#fff;font-weight:600}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.modal[hidden]{display:none}
.sheet{background:#141414;border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:18px}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:10px}
input,select{width:100%;margin-top:4px;background:#0a0a0a;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.sheet .row button{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--bg:#0b0b14;--card:#16162a;--line:#2a2a47;--mut:#9a9ab8;--ac:#a78bfa}
body{background:radial-gradient(circle at 20% -10%,#2a1b5e 0,#0b0b14 45%)}
h1{background:linear-gradient(90deg,#a78bfa,#f472b6,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{background:linear-gradient(135deg,#7c3aed,#db2777 60%,#f59e0b);border:0}
.hero h3,.hero .mut{color:#ffffffcc}
.in{color:#4ade80}.out{color:#fb7185}
.bar i{background:linear-gradient(90deg,#a78bfa,#f472b6)}
.bar.over i{background:#fb7185}
.c-wed i{background:linear-gradient(90deg,#f472b6,#fb7185)}.c-kul i{background:linear-gradient(90deg,#38bdf8,#818cf8)}
.c-hob i{background:linear-gradient(90deg,#fbbf24,#fb923c)}.c-cad i{background:linear-gradient(90deg,#34d399,#2dd4bf)}
.grid .card{border-left:4px solid}.grid .card:nth-child(1){border-color:#f472b6}.grid .card:nth-child(2){border-color:#fbbf24}.grid .card:nth-child(3){border-color:#4ade80}.grid .card:nth-child(4){border-color:#fb7185}
.pri{background:linear-gradient(90deg,#a78bfa,#f472b6);color:#fff;border:0}
.leg i{background:#4ade80}.leg i.g{background:#fb7185}
nav button.on{color:#f472b6}
svg text{fill:#9a9ab8}
.sheet{background:#1a1a33}input,select{background:#0b0b14}
</style>
</head>
<body>
<header><h1>Nana Budget</h1><span id="hdate"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>
<script>
'use strict';
const KEY = 'nanabudget.v1';
const OUTC = { kul: 'Kebutuhan Kuliah', hob: 'Hobi dan Kesenangan', cad: 'Dana Cadangan', lain: 'Lainnya' };
const INC = { gaji: 'Gaji', lain: 'Lainnya' };
const BUDN = { wed: 'Tabungan Pernikahan', kul: 'Kebutuhan Kuliah', hob: 'Hobi dan Kesenangan', cad: 'Dana Cadangan' };
const TL = { in: 'Pemasukan', out: 'Pengeluaran', save: 'Setor Tabungan Pernikahan' };
const TABS = [['home', 'Beranda'], ['tx', 'Transaksi'], ['wed', 'Tabungan'], ['bud', 'Anggaran'], ['data', 'Data']];

const def = () => ({ start: 1000, target: 0, payday: '2026-11-15', salary: 0,
  bud: { wed: 400000, kul: 300000, hob: 150000, cad: 150000 }, tx: [] });
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.tx)) return Object.assign(def(), s, { bud: Object.assign(def().bud, s.bud) }); } catch (e) {}
  return def();
}
let S = load(), view = 'home';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Gagal menyimpan: penyimpanan penuh'); } };

const $ = s => document.querySelector(s);
const rp = n => (n < 0 ? '-' : '') + 'Rp' + Math.abs(Math.round(n)).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fdate = s => new Date(s + 'T00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
const num = v => Number(String(v).replace(/\D/g, '')) || 0;
const sum = f => S.tx.filter(f).reduce((a, t) => a + t.amt, 0);
const bal = () => S.start + sum(t => t.type == 'in') - sum(t => t.type == 'out') - sum(t => t.type == 'save');
const mon = () => today().slice(0, 7);
function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'show'; setTimeout(() => t.className = '', 2200); }

function bars() {
  const d = new Date(), m = [];
  for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); m.push(x.getFullYear() + '-' + pad(x.getMonth() + 1)); }
  const v = m.map(k => [sum(t => t.type == 'in' && t.date.startsWith(k)), sum(t => t.type == 'out' && t.date.startsWith(k))]);
  const mx = Math.max(1, ...v.flat());
  return '<svg viewBox="0 0 300 130">' + v.map((p, i) => {
    const x = i * 50 + 8, a = p[0] / mx * 95, b = p[1] / mx * 95;
    return `<rect x="${x}" y="${105 - a}" width="16" height="${a}" rx="3" fill="#4ade80"/><rect x="${x + 18}" y="${105 - b}" width="16" height="${b}" rx="3" fill="#fb7185"/><text x="${x + 17}" y="122" text-anchor="middle">${m[i].slice(5)}/${m[i].slice(2, 4)}</text>`;
  }).join('') + '</svg><div class="leg"><i></i>Masuk<i class="g"></i>Keluar</div>';
}
function line() {
  const a = S.tx.filter(t => t.type == 'save').sort((x, y) => x.date.localeCompare(y.date));
  if (!a.length) return '<p class="mut">Belum ada setoran. Tekan "Setor" untuk mulai.</p>';
  let c = 0; const p = a.map(t => c += t.amt), mx = Math.max(...p), n = p.length;
  const pts = p.map((v, i) => [n > 1 ? 10 + i * 280 / (n - 1) : 150, 100 - v / mx * 85]);
  return '<svg viewBox="0 0 300 110"><polyline points="' + pts.map(q => q.join(',')).join(' ') + '" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round"/>' + pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#fbbf24"/>`).join('') + '</svg>';
}
function spent(k) { return k == 'wed' ? sum(t => t.type == 'save' && t.date.startsWith(mon())) : sum(t => t.type == 'out' && t.cat == k && t.date.startsWith(mon())); }
function prog(k) {
  const s = spent(k), b = S.bud[k], p = b ? Math.min(100, s / b * 100) : 0;
  return `<div class="row"><span>${BUDN[k]}</span><span class="mut">${rp(s)} / ${rp(b)}</span></div><div class="bar c-${k} ${b && s > b ? 'over' : ''}"><i style="width:${p}%"></i></div>`;
}
function list(arr) {
  if (!arr.length) return '<p class="mut">Belum ada transaksi.</p>';
  return arr.map(t => {
    const lbl = t.type == 'save' ? 'Setoran pernikahan' : (t.type == 'in' ? INC : OUTC)[t.cat] || t.cat;
    return `<div class="item" data-a="edit" data-id="${t.id}"><div>${esc(lbl)}<small>${fdate(t.date)}${t.note ? ' · ' + esc(t.note) : ''}</small></div><b class="${t.type == 'in' ? 'in' : 'out'}">${t.type == 'in' ? '+' : '-'}${rp(t.amt)}</b></div>`;
  }).join('');
}
const sorted = () => S.tx.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
const addBtns = '<div class="btns"><button class="pri" data-a="add" data-t="in">+ Pemasukan</button><button data-a="add" data-t="out">+ Pengeluaran</button><button data-a="add" data-t="save">Setor</button></div>';

const V = {
  home() {
    const days = Math.ceil((new Date(S.payday + 'T00:00') - new Date(today() + 'T00:00')) / 864e5);
    const inM = sum(t => t.type == 'in' && t.date.startsWith(mon())), outM = sum(t => t.type == 'out' && t.date.startsWith(mon()));
    return `<div class="card hero"><h3>Saldo tersedia</h3><div class="big">${rp(bal())}</div></div>${addBtns}
    <div class="grid"><div class="card"><h3>Tabungan pernikahan</h3><div class="mid">${rp(sum(t => t.type == 'save'))}</div></div>
    <div class="card"><h3>Gajian berikutnya</h3><div class="mid">${S.payday ? (days > 0 ? days + ' hari' : days == 0 ? 'Hari ini' : 'Terlewat') : '-'}</div><span class="mut">${S.payday ? fdate(S.payday) : 'Atur di Anggaran'}</span></div>
    <div class="card"><h3>Pemasukan bulan ini</h3><div class="mid">${rp(inM)}</div></div>
    <div class="card"><h3>Pengeluaran bulan ini</h3><div class="mid">${rp(outM)}</div></div></div>
    <div class="card" style="margin-top:12px"><h3>Grafik 6 bulan terakhir</h3>${bars()}</div>
    <div class="card"><h3>Ringkasan anggaran bulan ini</h3>${Object.keys(BUDN).map(prog).join('')}</div>`;
  },
  tx() { return addBtns + `<div class="card"><h3>Riwayat transaksi</h3>${list(sorted())}</div>`; },
  wed() {
    const tot = sum(t => t.type == 'save'), p = S.target ? Math.min(100, tot / S.target * 100) : 0;
    return `<div class="card hero"><h3>Total tabungan pernikahan</h3><div class="big">${rp(tot)}</div>
    <div class="bar"><i style="width:${p}%"></i></div><div class="row"><span>${S.target ? p.toFixed(1) + '% tercapai' : 'Target belum diatur'}</span><span class="mut">Target ${S.target ? rp(S.target) : '-'}</span></div></div>
    <div class="btns"><button class="pri" data-a="add" data-t="save">Setor</button><button data-a="target">Atur target</button></div>
    <div class="card"><h3>Perkembangan tabungan</h3>${line()}</div>
    <div class="card"><h3>Riwayat setoran</h3>${list(sorted().filter(t => t.type == 'save'))}</div>`;
  },
  bud() {
    const tot = Object.values(S.bud).reduce((a, b) => a + b, 0);
    return `<div class="card"><h3>Anggaran bulanan</h3><p class="mut">Anggaran hanya rencana. Saldo tidak berkurang sampai kamu mencatat transaksi.</p>
    ${Object.keys(BUDN).map(k => `<label>${BUDN[k]} (Rp)<input inputmode="numeric" data-bud="${k}" value="${S.bud[k]}"></label>`).join('')}
    <div class="row"><b>Total</b><b>${rp(tot)}</b></div>
    <p class="mut">Setoran pernikahan cepat:</p><div class="btns"><button data-a="wedset" data-v="300000">Min 300rb</button><button data-a="wedset" data-v="400000">Normal 400rb</button><button data-a="wedset" data-v="500000">Maks 500rb</button></div></div>
    <div class="card"><h3>Gaji</h3><label>Tanggal gajian berikutnya<input type="date" data-set="payday" value="${S.payday || ''}"></label>
    <label>Perkiraan gaji (Rp, kosongkan jika belum tahu)<input inputmode="numeric" data-set="salary" value="${S.salary || ''}"></label>
    <label>Saldo awal (Rp)<input inputmode="numeric" data-set="start" value="${S.start}"></label></div>`;
  },
  data() {
    return `<div class="card"><h3>Cadangkan &amp; pulihkan</h3><p class="mut">Data hanya tersimpan di HP ini. Ekspor berkala sebagai cadangan.</p>
    <div class="btns"><button class="pri" data-a="export">Ekspor JSON</button><button data-a="import">Impor JSON</button></div>
    <input type="file" id="file" accept=".json,application/json" hidden></div>
    <div class="card"><h3>Hapus data</h3><button class="danger" data-a="reset">Hapus semua data</button></div>`;
  }
};

function render() {
  $('#nav').innerHTML = TABS.map(t => `<button class="${t[0] == view ? 'on' : ''}" data-a="go" data-v="${t[0]}">${t[1]}</button>`).join('');
  $('#app').innerHTML = V[view](); $('#hdate').textContent = fdate(today());
  const f = $('#file'); if (f) f.onchange = doImport;
}
function go(v) { view = v; render(); scrollTo(0, 0); }

function openTx(type, id) {
  const t = id ? S.tx.find(x => x.id == id) : { type, amt: '', cat: type == 'in' ? 'gaji' : 'kul', date: today(), note: '' };
  if (!t) return;
  const cats = t.type == 'in' ? INC : OUTC, M = $('#modal');
  M.dataset.id = id || ''; M.dataset.type = t.type;
  M.innerHTML = `<form class="sheet" id="f"><h2>${id ? 'Edit ' : ''}${TL[t.type]}</h2>
  <label>Jumlah (Rp)<input name="amt" inputmode="numeric" required value="${t.amt}"></label>
  ${t.type == 'save' ? '' : `<label>Kategori<select name="cat">${Object.keys(cats).map(k => `<option value="${k}" ${k == t.cat ? 'selected' : ''}>${cats[k]}</option>`).join('')}</select></label>`}
  <label>Tanggal<input type="date" name="date" required value="${t.date}"></label>
  <label>Catatan<input name="note" value="${esc(t.note)}"></label>
  <div class="row"><button type="button" class="ghost" data-a="close">Batal</button>${id ? '<button type="button" class="danger" data-a="del">Hapus</button>' : ''}<button class="pri">Simpan</button></div></form>`;
  M.hidden = false;
}
const close = () => { $('#modal').hidden = true; };

$('#modal').addEventListener('submit', e => {
  e.preventDefault();
  const M = $('#modal'), f = new FormData(e.target), id = M.dataset.id, type = M.dataset.type, amt = num(f.get('amt'));
  if (amt <= 0) return toast('Jumlah harus lebih dari 0');
  const o = { type, amt, cat: type == 'save' ? 'wed' : f.get('cat'), date: f.get('date'), note: String(f.get('note') || '').trim() };
  const old = id ? S.tx.find(x => x.id == id) : null;
  const after = bal() + (old ? (old.type == 'in' ? -old.amt : old.amt) : 0) + (type == 'in' ? amt : -amt);
  if (after < 0 && !confirm('Saldo akan menjadi ' + rp(after) + '. Tetap simpan?')) return;
  if (old) Object.assign(old, o); else S.tx.push(Object.assign({ id: Date.now() }, o));
  save(); close(); render(); toast('Tersimpan');
});

function doExport() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = 'nana-budget-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('Cadangan diunduh');
}
function doImport(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.tx)) throw 0;
      if (!confirm('Data saat ini akan diganti dengan isi file. Lanjutkan?')) return;
      S = Object.assign(def(), d, { bud: Object.assign(def().bud, d.bud) }); save(); render(); toast('Data dipulihkan');
    } catch (x) { toast('File tidak valid'); }
  };
  r.readAsText(file); e.target.value = '';
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a == 'go') go(el.dataset.v);
  else if (a == 'add') openTx(el.dataset.t);
  else if (a == 'edit') openTx(null, id);
  else if (a == 'close') close();
  else if (a == 'del') { if (confirm('Hapus transaksi ini?')) { S.tx = S.tx.filter(x => x.id != $('#modal').dataset.id); save(); close(); render(); toast('Dihapus'); } }
  else if (a == 'target') { const v = prompt('Target dana pernikahan (Rp):', S.target || ''); if (v !== null) { S.target = num(v); save(); render(); } }
  else if (a == 'wedset') { S.bud.wed = +el.dataset.v; save(); render(); toast('Anggaran tabungan diubah'); }
  else if (a == 'export') doExport();
  else if (a == 'import') $('#file').click();
  else if (a == 'reset') { if (confirm('Semua data akan dihapus permanen. Lanjutkan?') && confirm('Yakin? Ekspor dulu jika perlu cadangan.')) { S = def(); save(); render(); toast('Data direset'); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bud) { S.bud[t.dataset.bud] = num(t.value); save(); render(); }
  else if (t.dataset.set) { const k = t.dataset.set; S[k] = k == 'payday' ? t.value : num(t.value); save(); render(); }
});

if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
render();
</script>
</body>
</html>
